<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clue: The Floors of Mystery</title>

    <style>
        body {
            background: #20252b;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            position: relative;
            margin: 0;
            padding: 10px;
        }

h2 {
    margin-top: 25px;
    letter-spacing: 3px;
}

#hud {
    margin-bottom: 15px;
    font-size: 16px;
}

#hud p {
    margin: 5px;
}

#gameContainer {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

canvas {
    background-color: #aeb8c2;
    display: block;
    margin: 5px;
    border: 2px solid #e0e0e0;
    border-radius: 4px;
    max-width: 100%;
}

#mapCanvas {
    background-color: #aeb8c2;
}

button {
    padding: 10px 22px;
    background: #3498db;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #217dbb;
}

#cheatContainer {
    margin-top: 15px;
}

#cheatInput {
    font-size: 16px;
    padding: 9px;
    width: 150px;
    border: 1px solid #bdc3c7;
    border-radius: 5px;
    background: #ecf0f1;
    color: #20252b;
}

#cheatButton {
    font-size: 16px;
    padding: 10px 18px;
}

#cheatDisplay {
    font-size: 16px;
    margin-top: 10px;
    color: #2ecc71;
}

#instructions {
    display: none;
    position: absolute;
    left: 10px;
    top: 100px;
    background-color: #303841;
    color: #bdc3c7;
    padding: 15px;
    border: 1px solid #3498db;
    border-radius: 5px;
    text-align: left;
    font-size: 14px;
    line-height: 1.7;
    z-index: 200;
}

#buttonControls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: none;
}

#buttonControls button {
    font-size: 30px;
    padding: 15px 22px;
    margin: 5px;
    border-radius: 8px;
    background: #3498db;
}

#buttonControls button:hover {
    background: #217dbb;
}

#livesIcons {
    display: inline-flex;
    gap: 5px;
    align-items: center;
    justify-content: center;
}

.life-icon {
    width: 24px;
    height: 24px;
}

/* Mobile layout */
@media (max-width: 768px) {
    #gameContainer {
        flex-direction: column;
        align-items: center;
    }

    canvas {
        width: 95%;
        height: auto;
    }

    #mapCanvas {
        display: block;
        margin-top: 10px;
    }

    #instructions {
        position: fixed;
        left: 5%;
        right: 5%;
        top: 100px;
    }
}

/* Desktop layout */
@media (min-width: 769px) {
    #gameContainer {
        flex-direction: row;
        justify-content: center;
    }

    #mapCanvas {
        display: block;
        margin-left: 10px;
    }
}
    </style>
</head>
<body>
    <h1>CLUE: THE FLOORS OF MYSTERY</h1>
    <p>If you can see this on a dark background, the CSS works!</p>
    <button>Test Button</button>
</body>
</html>
